[package]
name = "redmine-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
redmine-core = { path = "../redmine-core" }
redmine-types = { path = "../redmine-types" }
rmcp = { version = "2", features = ["server", "transport-io", "local"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
anyhow = "1"
